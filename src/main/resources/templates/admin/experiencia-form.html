<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Nueva experiencia')"></head>
<body>

<div class="container mt-5">
    <h1 class="mb-4" th:text="${experiencia.id == null} ? 'Nueva Experiencia' : 'Editar Experiencia'"></h1>

    <form th:action="@{/admin/experiencia/save}" th:object="${experiencia}" method="post" class="card card-body shadow">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Puesto</label>
            <input type="text" th:field="*{puesto}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Empresa</label>
            <input type="text" th:field="*{empresa}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha inicio</label>
            <input type="date" th:field="*{fechaInicio}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha fin</label>
            <input type="date" th:field="*{fechaFin}" class="form-control"/>
            <small class="form-text text-muted">Dejar vacío si es actual</small>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/admin/experiencia}" class="btn btn-secondary ms-2">Cancelar</a>

    </form>
</div>

</body>
</html>
