<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>

<div class="container mt-5">
    <h1 class="mb-4" th:text="${info.id == null} ? 'Nueva Información' : 'Editar Información'"></h1>

    <form th:action="@{/admin/info/save}" th:object="${info}" method="post" class="card card-body shadow">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Foto URL</label>
            <input type="text" th:field="*{fotoUrl}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" th:field="*{email}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">LinkedIn</label>
            <input type="text" th:field="*{linkedin}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">GitHub</label>
            <input type="text" th:field="*{github}" class="form-control"/>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/admin}" class="btn btn-secondary ms-2">Cancelar</a>

    </form>
</div>

</body>
</html>
