<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Información personal')"></head>
<body>

<div class="container mt-5">
    <h1 class="mb-4">Información Personal</h1>

    <a th:href="@{/admin/info}" class="btn btn-success mb-3">Editar Información</a>

    <div class="d-flex gap-2">
        <a th:href="@{/admin}" class="btn btn-light" style="margin-bottom: 30px">Volver</a>
    </div>


    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>LinkedIn</th>
            <th>GitHub</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="info : ${infoList}">
            <td th:text="${info.nombre}"></td>
            <td th:text="${info.email}"></td>
            <td>
                <a th:href="${info.linkedin}" target="_blank" th:text="${info.linkedin}"></a>
            </td>
            <td>
                <a th:href="${info.github}" target="_blank" th:text="${info.github}"></a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
