<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Proyectos')}"></head>
<body class="d-flex flex-column min-vh-100">
<!-- Navbar -->
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container-fluid flex-grow-1">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{fragments/header :: sidebar}"></div>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 text-uppercase">Proyectos</h1>
                <a th:href="@{/admin}" class="btn btn-secondary">← Volver</a>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/admin/proyecto/save}" th:object="${proyecto}" method="post">
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre del proyecto</label>
                                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="descripcion" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="4" required></textarea>
                                    <small class="text-muted">Breve descripción del proyecto</small>
                                </div>

                                <div class="mb-3">
                                    <label for="fotoUrl" class="form-label">URL de la imagen (opcional)</label>
                                    <input type="text" class="form-control" id="fotoUrl" th:field="*{imagenUrl}" placeholder="/img/img.jpg">
                                    <small class="text-muted">Ruta local o URL de la imagen del proyecto</small>
                                </div>

                                <div class="mb-3">
                                    <label for="githubUrl" class="form-label">URL del repositorio (opcional)</label>
                                    <input type="text" class="form-control" id="githubUrl" th:field="*{githubUrl}" placeholder="https://www.github.com/tu-user">
                                    <small class="text-muted">URL del repositorio del proyecto</small>
                                </div>

                                <div class="mb-3">
                                    <label for="fecha" class="form-label">Fecha</label>
                                    <input type="date" class="form-control" id="fecha" th:field="*{fecha}" placeholder="dd/mm/yyyy" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Lenguajes</label>
                                    <div class="d-flex flex-wrap gap-2">
                                        <div th:each="leng : ${lenguajes}" class="form-check">
                                            <input class="form-check-input"
                                                   type="checkbox"
                                                   th:field="*{lenguajes}"
                                                   th:value="${leng.id}">
                                            <label class="form-check-label" th:text="${leng.name}"></label>
                                        </div>
                                    </div>
                                </div>




                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">💾 Guardar</button>
                                    <a th:href="@{/admin}" class="btn btn-light">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Scripts -->
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
