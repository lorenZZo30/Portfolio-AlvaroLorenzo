<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>

<div class="container mt-5">
    <h1 class="mb-4" th:text="${estudios.id == null} ? 'Nuevo Estudio' : 'Editar Estudio'"></h1>

    <form th:action="@{/admin/estudios/save}" th:object="${estudios}" method="post" class="card card-body shadow">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" th:field="*{titulo}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Institución</label>
            <input type="text" th:field="*{institucion}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha inicio</label>
            <input type="date" th:field="*{fechaInicio}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha fin</label>
            <input type="date" th:field="*{fechaFin}" class="form-control"/>
            <small class="form-text text-muted">Dejar vacío si está en curso</small>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/admin/estudios}" class="btn btn-secondary ms-2">Cancelar</a>

    </form>
</div>

</body>
</html>
