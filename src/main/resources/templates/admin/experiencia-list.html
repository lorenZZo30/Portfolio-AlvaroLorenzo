<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>

<div class="container mt-5">
    <h1 class="mb-4">Experiencia Laboral</h1>

    <a th:href="@{/admin/experiencia/new}" class="btn btn-success mb-3">Nueva Experiencia</a>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Puesto</th>
            <th>Empresa</th>
            <th>Fecha inicio</th>
            <th>Fecha fin</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="exp : ${experiencias}">
            <td th:text="${exp.puesto}"></td>
            <td th:text="${exp.empresa}"></td>
            <td th:text="${exp.fechaInicio}"></td>
            <td th:text="${exp.fechaFin != null ? exp.fechaFin : 'Actual'}"></td>
            <td>
                <a th:href="@{/admin/experiencia/edit/{id}(id=${exp.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/admin/experiencia/delete/{id}(id=${exp.id})}"
                      method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Eliminar esta experiencia?')">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
